name: PHP

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            dependencies: latest
          - php: '8.4'
            dependencies: latest
          - php: '8.5'
            dependencies: latest
          - php: '8.3'
            dependencies: lowest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Resolve dependencies on the actual runtime
        run: composer update --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Validate, analyse, test and build documentation
        run: composer --no-plugins check
      - name: Audit resolved dependencies
        run: composer --no-plugins audit --locked
      - name: Documentation preview
        if: matrix.php == '8.5' && matrix.dependencies == 'latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-documentation-preview
          path: build/site/
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Core without optional adapters / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - run: composer --no-plugins validate --strict
      - run: php tools/check-runtime.php
